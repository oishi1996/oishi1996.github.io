# GitHub Actions で Hugo サイトをビルドして GitHub Pages にデプロイするワークフロー
name: Deploy Hugo site to Pages

on:
  # メインブランチにプッシュされた時に実行
  push:
    branches: ["main"]

  # 手動実行も可能にする
  workflow_dispatch:

# 実行に必要な権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行の制御（古いジョブをキャンセルして最新を優先）
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.128.0 # 使用しているHugoのバージョンに近いものを指定（最新版でOK）
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # Blowfishテーマ（サブモジュール）を取得するために必須
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true # BlowfishはExtended版（SCSS等）が必要です

      - name: Build with Hugo
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4